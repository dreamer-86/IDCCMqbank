<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>IDCCM Complete Question Bank - All Modules</title>
    <style>
        /* ───────────── Reset & Base ───────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f9;
            color: #1a2a3a;
            padding: 16px;
        }

        .app-container {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 28px 32px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 2px solid #e8edf4;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #4a6a85;
            margin-left: auto;
        }
        .badge {
            background: #1b4d7a;
            color: #fff;
            font-size: 12px;
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 500;
        }

        /* ───────────── Top Bar ───────────── */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .progress-info {
            font-size: 14px;
            font-weight: 500;
            color: #1e3b5a;
            background: #eef3f9;
            padding: 5px 16px;
            border-radius: 30px;
        }
        .module-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .module-selector label {
            font-weight: 600;
            font-size: 13px;
            color: #1e3b5a;
        }
        .module-selector select {
            padding: 7px 14px;
            border-radius: 30px;
            border: 1.5px solid #cddae9;
            background: #fff;
            font-size: 13px;
            font-weight: 500;
            color: #0b2b4a;
            cursor: pointer;
            outline: none;
            min-width: 200px;
            max-width: 280px;
        }
        .module-selector select:focus {
            border-color: #2a6b9e;
            box-shadow: 0 0 0 3px rgba(42, 107, 158, 0.15);
        }

        /* ───────────── Search ───────────── */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1.5px solid #cddae9;
            font-size: 14px;
            outline: none;
            min-width: 150px;
        }
        .search-bar input:focus {
            border-color: #2a6b9e;
            box-shadow: 0 0 0 3px rgba(42, 107, 158, 0.12);
        }
        .search-bar .btn {
            padding: 8px 20px;
        }

        /* ───────────── Question Card ───────────── */
        .question-card {
            background: #fafcff;
            border-radius: 16px;
            padding: 22px 26px;
            border: 1px solid #e3eaf2;
            margin-bottom: 18px;
        }
        .q-number {
            font-size: 13px;
            font-weight: 600;
            color: #2a6b9e;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .q-text {
            font-size: 17px;
            font-weight: 500;
            line-height: 1.5;
            color: #0a1e2f;
            margin-bottom: 18px;
        }

        /* ───────────── Options ───────────── */
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #dfe8f2;
            background: #fff;
            font-size: 15px;
            font-weight: 450;
            color: #1a2a3a;
            cursor: pointer;
            transition: 0.1s;
            line-height: 1.4;
        }
        .option-btn:hover:not(.disabled) {
            border-color: #8ab3d0;
            background: #f2f8ff;
        }
        .option-btn.disabled {
            cursor: default;
            opacity: 0.85;
        }
        .option-btn.correct {
            border-color: #1b8c5e;
            background: #e1f5ed;
            color: #0b553b;
        }
        .option-btn.wrong {
            border-color: #c73a3a;
            background: #fde8e8;
            color: #8a1f1f;
        }
        .option-btn.reveal-correct {
            border-color: #1b8c5e;
            background: #e1f5ed;
            color: #0b553b;
        }
        .option-btn.selected {
            border-color: #2a6b9e;
            background: #dce8f5;
        }

        /* ───────────── Explanation ───────────── */
        .explanation-box {
            background: #f0f5fb;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 6px;
            border-left: 4px solid #2a6b9e;
            display: none;
        }
        .explanation-box.visible {
            display: block;
        }
        .explanation-box strong {
            color: #0b2b4a;
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .explanation-box .reason {
            font-size: 14px;
            line-height: 1.6;
            color: #1a334a;
        }

        /* ───────────── Buttons ───────────── */
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
            align-items: center;
        }
        .btn {
            padding: 8px 22px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.12s;
            background: #e8eef6;
            color: #1e3b5a;
        }
        .btn:hover:not(:disabled) {
            background: #d3dfec;
            transform: translateY(-1px);
        }
        .btn-primary {
            background: #1b4d7a;
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: #123a5e;
        }
        .btn-success {
            background: #1b8c5e;
            color: #fff;
        }
        .btn-success:hover:not(:disabled) {
            background: #14734b;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #2a6b9e;
            color: #2a6b9e;
        }
        .btn-outline:hover:not(:disabled) {
            background: #e3edf7;
        }
        .btn-danger {
            background: #b13a3a;
            color: #fff;
        }
        .btn-danger:hover:not(:disabled) {
            background: #8f2b2b;
        }
        .btn-warning {
            background: #d48c2c;
            color: #fff;
        }
        .btn-warning:hover:not(:disabled) {
            background: #b3731f;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ───────────── Stats ───────────── */
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 28px;
            margin-top: 14px;
            padding-top: 16px;
            border-top: 1px solid #e3eaf2;
            font-size: 13px;
            font-weight: 500;
            color: #1a3b57;
        }
        .stats span {
            background: #eef3f9;
            padding: 2px 14px;
            border-radius: 30px;
        }
        .stats .correct-stat {
            background: #e1f5ed;
            color: #0b553b;
        }
        .stats .wrong-stat {
            background: #fde8e8;
            color: #8a1f1f;
        }

        /* ───────────── Progress Bar ───────────── */
        .progress-bar-wrap {
            width: 100%;
            height: 4px;
            background: #e3eaf2;
            border-radius: 4px;
            margin: 10px 0 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #1b8c5e;
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* ───────────── Responsive ───────────── */
        @media (max-width: 640px) {
            .app-container {
                padding: 14px 12px;
            }
            h1 {
                font-size: 20px;
            }
            .q-text {
                font-size: 15px;
            }
            .option-btn {
                font-size: 14px;
                padding: 10px 12px;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .module-selector select {
                width: 100%;
                max-width: 100%;
            }
            .action-row .btn {
                flex: 1 1 auto;
                text-align: center;
                font-size: 13px;
                padding: 8px 14px;
            }
            .search-bar input {
                min-width: 100px;
            }
        }

        /* ───────────── Toast ───────────── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2a3a;
            color: #fff;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 999;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: #1b8c5e;
        }
        .toast.error {
            background: #b13a3a;
        }

        /* ───────────── Empty state ───────────── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #4a6a85;
        }
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #1a2a3a;
        }
        .empty-state p {
            font-size: 15px;
        }

        .mt-8 { margin-top: 8px; }
        .mb-6 { margin-bottom: 6px; }
        .flex-center { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <h1>
            🧠 IDCCM Complete Question Bank
            <small>All 27 Modules</small>
            <span class="badge" id="totalQuestionsBadge">0 Qs</span>
        </h1>

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="progress-info" id="progressInfo">
                Q <span id="qIndexDisplay">1</span> / <span id="qTotalDisplay">0</span>
                <span style="margin-left:10px;font-weight:400;color:#4a6a85;">|</span>
                <span id="moduleNameDisplay" style="font-weight:400;color:#4a6a85;">All Modules</span>
            </div>
            <div class="module-selector">
                <label for="moduleSelect">📚 Module:</label>
                <select id="moduleSelect"></select>
            </div>
        </div>

        <!-- Search -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search questions..." />
            <button class="btn btn-outline" id="clearSearchBtn" style="padding:8px 16px;">✕ Clear</button>
        </div>

        <!-- Question Card -->
        <div class="question-card" id="questionCard">
            <div class="q-number" id="qNumber">Question 1</div>
            <div class="q-text" id="qText">Loading questions...</div>

            <div class="options" id="optionsContainer"></div>

            <!-- Explanation -->
            <div class="explanation-box" id="explanationBox">
                <strong>📖 Explanation</strong>
                <div class="reason" id="explanationText"></div>
            </div>

            <!-- Action Buttons -->
            <div class="action-row">
                <button class="btn btn-success" id="submitBtn" disabled>Submit Answer</button>
                <button class="btn btn-primary" id="nextBtn">Next →</button>
                <button class="btn btn-primary" id="prevBtn">← Prev</button>
                <button class="btn btn-outline" id="resetBtn">🔄 Reset</button>
                <button class="btn btn-warning" id="showAnswerBtn">💡 Show Answer</button>
                <button class="btn btn-danger" id="shuffleBtn">🎲 Shuffle</button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats" id="statsBar">
            <span>📊 Total: <strong id="totalCount">0</strong></span>
            <span class="correct-stat">✅ Correct: <strong id="correctCount">0</strong></span>
            <span class="wrong-stat">❌ Wrong: <strong id="wrongCount">0</strong></span>
            <span>📈 Score: <strong id="scorePercent">0%</strong></span>
            <span>⏳ Remaining: <strong id="remainingCount">0</strong></span>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

        };

        // ═══════════════════════════════════════════════════════════════
        // 2.  FLATTEN ALL QUESTIONS WITH MODULE METADATA
        // ═══════════════════════════════════════════════════════════════

        const ALL_QUESTIONS = [];
        const MODULE_NAMES = {};

        for (const [key, module] of Object.entries(MODULE_DATA)) {
            MODULE_NAMES[key] = module.name;
            for (const q of module.questions) {
                ALL_QUESTIONS.push({
                    ...q,
                    moduleKey: key,
                    moduleName: module.name
                });
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // 3.  APP STATE
        // ═══════════════════════════════════════════════════════════════

        let state = {
            currentModule: 'all',
            currentIndex: 0,
            answered: false,
            selectedOption: null,
            filteredQuestions: [],
            progress: {
                correct: 0,
                wrong: 0,
                answered: new Set(),
                results: {} // index -> { selected, correct }
            },
            searchQuery: ''
        };

        // DOM refs
        const $ = (id) => document.getElementById(id);
        const moduleSelect = $('moduleSelect');
        const searchInput = $('searchInput');
        const clearSearchBtn = $('clearSearchBtn');
        const qIndexDisplay = $('qIndexDisplay');
        const qTotalDisplay = $('qTotalDisplay');
        const moduleNameDisplay = $('moduleNameDisplay');
        const totalQuestionsBadge = $('totalQuestionsBadge');
        const qNumber = $('qNumber');
        const qText = $('qText');
        const optionsContainer = $('optionsContainer');
        const submitBtn = $('submitBtn');
        const nextBtn = $('nextBtn');
        const prevBtn = $('prevBtn');
        const resetBtn = $('resetBtn');
        const showAnswerBtn = $('showAnswerBtn');
        const shuffleBtn = $('shuffleBtn');
        const explanationBox = $('explanationBox');
        const explanationText = $('explanationText');
        const totalCount = $('totalCount');
        const correctCount = $('correctCount');
        const wrongCount = $('wrongCount');
        const remainingCount = $('remainingCount');
        const scorePercent = $('scorePercent');
        const progressBarFill = $('progressBarFill');
        const toast = $('toast');

        // ──────────────────────────────────────────────
        // 4.  FILTERING
        // ──────────────────────────────────────────────

        function getFilteredQuestions() {
            let qs = ALL_QUESTIONS;

            // Module filter
            if (state.currentModule !== 'all') {
                qs = qs.filter(q => q.moduleKey === state.currentModule);
            }

            // Search filter
            if (state.searchQuery.trim()) {
                const query = state.searchQuery.toLowerCase().trim();
                qs = qs.filter(q =>
                    q.question.toLowerCase().includes(query) ||
                    q.options.some(opt => opt.toLowerCase().includes(query))
                );
            }

            return qs;
        }

        function updateFilteredList() {
            state.filteredQuestions = getFilteredQuestions();
            if (state.filteredQuestions.length === 0) {
                state.currentIndex = 0;
                renderEmptyState();
                return;
            }
            if (state.currentIndex >= state.filteredQuestions.length) {
                state.currentIndex = 0;
            }
            renderQuestion();
        }

        // ──────────────────────────────────────────────
        // 5.  RENDER
        // ──────────────────────────────────────────────

        function renderEmptyState() {
            qNumber.textContent = 'No questions found';
            qText.textContent = 'Try adjusting your search or module filter.';
            optionsContainer.innerHTML = '';
            explanationBox.classList.remove('visible');
            submitBtn.disabled = true;
            const total = state.filteredQuestions.length;
            qIndexDisplay.textContent = 0;
            qTotalDisplay.textContent = total;
            moduleNameDisplay.textContent = state.currentModule === 'all' ? 'All Modules' : MODULE_NAMES[state.currentModule] || state.currentModule;
            totalQuestionsBadge.textContent = `${total} Qs`;
            updateStats();
        }

        function renderQuestion() {
            const qs = state.filteredQuestions;
            if (qs.length === 0) {
                renderEmptyState();
                return;
            }

            const q = qs[state.currentIndex];
            if (!q) {
                renderEmptyState();
                return;
            }

            // Reset UI
            state.answered = false;
            state.selectedOption = null;
            submitBtn.disabled = true;
            explanationBox.classList.remove('visible');

            // Update navigation
            const total = qs.length;
            qIndexDisplay.textContent = state.currentIndex + 1;
            qTotalDisplay.textContent = total;
            moduleNameDisplay.textContent = state.currentModule === 'all' ? 'All Modules' : MODULE_NAMES[state.currentModule] || state.currentModule;
            totalQuestionsBadge.textContent = `${total} Qs`;

            qNumber.textContent = `Question ${state.currentIndex + 1} of ${total} (${q.moduleName})`;
            qText.textContent = q.question;

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${String.fromCharCode(65 + idx)}. ${opt}`;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => handleOptionClick(idx));
                optionsContainer.appendChild(btn);
            });

            // Restore if previously answered
            const result = state.progress.results[state.currentIndex];
            if (result) {
                state.answered = true;
                submitBtn.disabled = true;
                const btns = optionsContainer.querySelectorAll('.option-btn');
                btns.forEach((btn, i) => {
                    btn.classList.add('disabled');
                    if (i === q.correctIndex) btn.classList.add('reveal-correct');
                    if (result.selected === i && i !== q.correctIndex) btn.classList.add('wrong');
                    if (i === result.selected && i === q.correctIndex) btn.classList.add('correct');
                });
                explanationText.textContent = q.explanation;
                explanationBox.classList.add('visible');
            }

            updateStats();
        }

        function updateStats() {
            const total = state.filteredQuestions.length;
            const answeredCount = state.progress.answered.size;
            const correct = state.progress.correct;
            const wrong = state.progress.wrong;
            const remaining = total - answeredCount;
            const score = answeredCount > 0 ? Math.round((correct / answeredCount) * 100) : 0;

            totalCount.textContent = total;
            correctCount.textContent = correct;
            wrongCount.textContent = wrong;
            remainingCount.textContent = remaining;
            scorePercent.textContent = answeredCount > 0 ? score + '%' : '0%';

            const pct = total > 0 ? Math.round((answeredCount / total) * 100) : 0;
            progressBarFill.style.width = pct + '%';
        }

        // ──────────────────────────────────────────────
        // 6.  INTERACTIONS
        // ──────────────────────────────────────────────

        function handleOptionClick(index) {
            if (state.answered) return;
            state.selectedOption = index;
            const btns = optionsContainer.querySelectorAll('.option-btn');
            btns.forEach((btn, i) => {
                btn.style.borderColor = i === index ? '#2a6b9e' : '#dfe8f2';
                btn.style.background = i === index ? '#dce8f5' : '#fff';
                btn.classList.toggle('selected', i === index);
            });
            submitBtn.disabled = false;
        }

        function handleSubmit() {
            if (state.answered || state.selectedOption === null) return;
            const q = state.filteredQuestions[state.currentIndex];
            const isCorrect = state.selectedOption === q.correctIndex;

            state.progress.results[state.currentIndex] = {
                selected: state.selectedOption,
                correct: isCorrect
            };
            state.progress.answered.add(state.currentIndex);
            if (isCorrect) state.progress.correct += 1;
            else state.progress.wrong += 1;
            state.answered = true;
            submitBtn.disabled = true;

            const btns = optionsContainer.querySelectorAll('.option-btn');
            btns.forEach((btn, i) => {
                btn.classList.add('disabled');
                if (i === q.correctIndex) btn.classList.add('reveal-correct');
                if (i === state.selectedOption && i !== q.correctIndex) btn.classList.add('wrong');
                if (i === state.selectedOption && i === q.correctIndex) btn.classList.add('correct');
            });

            explanationText.textContent = q.explanation;
            explanationBox.classList.add('visible');

            updateStats();
            showToast(isCorrect ? '✅ Correct!' : '❌ Incorrect. See explanation below.', isCorrect ? 'success' : 'error');
        }

        function handleNext() {
            const total = state.filteredQuestions.length;
            if (total === 0) return;
            state.currentIndex = (state.currentIndex + 1) % total;
            renderQuestion();
        }

        function handlePrev() {
            const total = state.filteredQuestions.length;
            if (total === 0) return;
            state.currentIndex = (state.currentIndex - 1 + total) % total;
            renderQuestion();
        }

        function handleReset() {
            if (!confirm('Reset all progress? This will clear your answers and scores for the current module.')) return;
            state.progress.correct = 0;
            state.progress.wrong = 0;
            state.progress.answered = new Set();
            state.progress.results = {};
            state.currentIndex = 0;
            renderQuestion();
            showToast('🔄 Progress reset!', '');
        }

        function handleShowAnswer() {
            const qs = state.filteredQuestions;
            if (qs.length === 0) return;
            const q = qs[state.currentIndex];

            if (state.answered) {
                explanationText.textContent = q.explanation;
                explanationBox.classList.add('visible');
                return;
            }

            const btns = optionsContainer.querySelectorAll('.option-btn');
            btns.forEach((btn, i) => {
                btn.classList.add('disabled');
                if (i === q.correctIndex) btn.classList.add('reveal-correct');
            });
            explanationText.textContent = q.explanation;
            explanationBox.classList.add('visible');
            submitBtn.disabled = true;
            state.answered = true;
            showToast('💡 Answer revealed. Your score is not affected.', '');
        }

        function handleShuffle() {
            const qs = state.filteredQuestions;
            if (qs.length === 0) return;
            // Fisher-Yates shuffle
            for (let i = qs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [qs[i], qs[j]] = [qs[j], qs[i]];
            }
            state.filteredQuestions = qs;
            state.currentIndex = 0;
            // Reset progress for shuffled order
            state.progress.correct = 0;
            state.progress.wrong = 0;
            state.progress.answered = new Set();
            state.progress.results = {};
            renderQuestion();
            showToast('🎲 Questions shuffled! Progress reset.', '');
        }

        function handleSearch() {
            state.searchQuery = searchInput.value;
            state.currentIndex = 0;
            state.progress.correct = 0;
            state.progress.wrong = 0;
            state.progress.answered = new Set();
            state.progress.results = {};
            updateFilteredList();
        }

        function clearSearch() {
            searchInput.value = '';
            state.searchQuery = '';
            state.currentIndex = 0;
            state.progress.correct = 0;
            state.progress.wrong = 0;
            state.progress.answered = new Set();
            state.progress.results = {};
            updateFilteredList();
            showToast('🔍 Search cleared', '');
        }

        // ──────────────────────────────────────────────
        // 7.  TOAST
        // ──────────────────────────────────────────────

        let toastTimeout;

        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast';
            if (type) toast.classList.add(type);
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ──────────────────────────────────────────────
        // 8.  MODULE SELECTOR
        // ──────────────────────────────────────────────

        function populateModuleSelector() {
            let html = `<option value="all">📖 All Modules (${ALL_QUESTIONS.length})</option>`;
            for (const [key, module] of Object.entries(MODULE_DATA)) {
                html += `<option value="${key}">📚 ${module.name} (${module.questions.length})</option>`;
            }
            moduleSelect.innerHTML = html;
        }

        // ──────────────────────────────────────────────
        // 9.  KEYBOARD SHORTCUTS
        // ──────────────────────────────────────────────

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;

            if (!state.answered) {
                const num = parseInt(e.key);
                if (num >= 1 && num <= 4) {
                    const idx = num - 1;
                    const btns = optionsContainer.querySelectorAll('.option-btn');
                    if (btns[idx]) btns[idx].click();
                }
            }
            if (e.key === 'Enter' && !submitBtn.disabled) {
                handleSubmit();
            }
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                handleNext();
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                handlePrev();
            }
            if (e.key === 'r' || e.key === 'R') {
                handleReset();
            }
            if (e.key === 's' || e.key === 'S') {
                e.preventDefault();
                handleShowAnswer();
            }
        });

        // ──────────────────────────────────────────────
        // 10. INIT
        // ──────────────────────────────────────────────

        function init() {
            populateModuleSelector();
            state.filteredQuestions = getFilteredQuestions();
            state.currentIndex = 0;
            renderQuestion();

            // Event listeners
            moduleSelect.addEventListener('change', () => {
                state.currentModule = moduleSelect.value;
                state.currentIndex = 0;
                state.progress.correct = 0;
                state.progress.wrong = 0;
                state.progress.answered = new Set();
                state.progress.results = {};
                state.searchQuery = '';
                searchInput.value = '';
                updateFilteredList();
                showToast(`📚 Switched to ${moduleSelect.options[moduleSelect.selectedIndex].text}`, '');
            });

            searchInput.addEventListener('input', handleSearch);
            clearSearchBtn.addEventListener('click', clearSearch);

            submitBtn.addEventListener('click', handleSubmit);
            nextBtn.addEventListener('click', handleNext);
            prevBtn.addEventListener('click', handlePrev);
            resetBtn.addEventListener('click', handleReset);
            showAnswerBtn.addEventListener('click', handleShowAnswer);
            shuffleBtn.addEventListener('click', handleShuffle);

            console.log(`✅ IDCCM Complete Question Bank loaded!`);
            console.log(`📚 ${ALL_QUESTIONS.length} questions across ${Object.keys(MODULE_DATA).length} modules.`);
            console.log('🎯 Keyboard shortcuts: 1-4=select, Enter=submit, Space/→=next, ←=prev, R=reset, S=show answer');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
